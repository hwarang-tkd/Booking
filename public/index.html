<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>預約課程</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <meta name="theme-color" content="#d4959a">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img src="/logo.png" alt=""><span data-school>花郎武道館</span></a>
      <nav class="nav" data-student>
        <a href="/" aria-current="page">預約課程</a>
        <a href="/info">課表與收費</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>選擇上課時間</h1>
    <p class="sub" id="intro">點選日期，查看當天可預約的課程。</p>

    <div class="filters" id="filters" role="group" aria-label="篩選課程"></div>
    <div class="datestrip" id="dates" role="group" aria-label="選擇日期"></div>
    <div id="list" class="stack" aria-live="polite"><div class="empty">載入中…</div></div>
  </main>

  <!-- 確認預約 -->
  <dialog id="bookDlg">
    <form id="bookForm" method="dialog">
      <div class="dlg-head"><h3>確認預約</h3></div>
      <div class="dlg-body stack">
        <div class="summary" id="bookSummary"></div>
        <div id="bookWhoBox"></div>
        <div id="bookPass" class="callout" style="margin:0">確認堂數中…</div>
        <label class="field">給老師的備註 <span class="hint">（選填）</span>
          <input type="text" name="note" maxlength="200" placeholder="例如：會晚 10 分鐘到">
        </label>
        <div id="bookErr" class="hidden"></div>
      </div>
      <div class="dlg-foot">
        <button type="button" class="btn secondary" data-close>取消</button>
        <button type="submit" class="btn" id="bookBtn">確認預約</button>
      </div>
    </form>
  </dialog>

  <footer class="site"></footer>

  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
