<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的預約</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <meta name="theme-color" content="#d4959a">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img src="/logo.png" alt=""><span data-school>花郎武道館</span></a>
      <nav class="nav" data-student>
        <a href="/">預約課程</a>
        <a href="/info">課表與收費</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>我的預約</h1>

    <!-- 未登入 -->
    <form id="loginForm" class="card stack hidden" style="max-width:420px">
      <p style="margin:0">用你的信箱和密碼登入，查看和取消預約。</p>
      <div data-login></div>
      <button class="btn block" type="submit">登入</button>
    </form>

    <!-- 已登入 -->
    <section id="mine" class="hidden">
      <div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:1.1rem" id="meName"></div>
          <div class="muted" style="font-size:.9rem;word-break:break-all" id="meEmail"></div>
        </div>
        <a class="btn" href="/">＋ 預約課程</a>
        <button class="btn secondary" id="logout">登出</button>
      </div>
      <h2>我的堂數</h2>
      <div id="passes" class="stack"></div>
      <div id="result" class="stack" style="margin-top:8px" aria-live="polite"></div>

      <h2>帳號設定</h2>
      <div class="card stack">
        <a class="btn secondary" href="/register?add=1" style="align-self:flex-start">＋ 新增家人（兄弟姊妹）</a>
        <details>
          <summary style="cursor:pointer;font-weight:600">變更密碼</summary>
          <form id="pwForm" class="stack" style="margin-top:10px;max-width:380px">
            <input type="email" name="username" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
            <label class="field">目前的密碼 <input type="password" name="current" autocomplete="current-password"></label>
            <label class="field">新密碼 <span class="hint">（至少 8 個字元）</span>
              <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
            <label class="field">再輸入一次 <input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
            <div id="pwMsg" class="hidden"></div>
            <button class="btn" type="submit">變更密碼</button>
          </form>
        </details>
      </div>
    </section>
  </main>

  <footer class="site"></footer>

  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/my.js"></script>
</body>
</html>
