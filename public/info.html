<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課表</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <meta name="theme-color" content="#d4959a">
  <link rel="stylesheet" href="/style.css">
  <style>
    main.wide { max-width: 1040px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img src="/logo.png" alt=""><span data-school>花郎武道館</span></a>
      <nav class="nav" data-student>
        <a href="/">預約課程</a>
        <a href="/rent">場地租借</a>
        <a href="/info" aria-current="page">課表</a>
        <a href="/rates">收費</a>
      </nav>
    </div>
  </header>

  <main class="wide">
    <h1>每週課表</h1>
    <p class="sub">親愛的會員們，來上課前記得先<a href="/">線上報名</a>喔！收費方式請見<a href="/rates">收費</a>。</p>
    <div id="week" class="week" aria-live="polite"><div class="empty">載入中…</div></div>

    <h2>地址</h2>
    <div class="card" id="addr"></div>
  </main>

  <footer class="site"></footer>

  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script>
    (async () => {
      const box = document.getElementById('week');
      try {
        const cfg = await applyConfig();
        const { templates } = await api('/api/templates');
        box.innerHTML = '';
        for (const d of [1, 2, 3, 4, 5, 6, 0]) {
          const col = document.createElement('div');
          col.className = 'col';
          const items = templates.filter((t) => t.weekday === d);
          col.innerHTML = `<h3>禮拜${DOW[d]}</h3>` + (items.length ? items.map((t) => `
            <div class="cls" style="${catStyle(t.category)}">
              <div><b>${esc(ctitle(t))}</b>${csub(t) ? `<span class="st">${csub(t).split('・').map(esc).join('<i>・</i><br>')}</span>` : ''}</div>
              <div class="t">${t.time}–${endTime('2000-01-01T' + t.time, t.durationMin)}</div>
            </div>`).join('') : '<div class="none">可供出租</div>');
          box.appendChild(col);
        }
        const q = encodeURIComponent(cfg.address);
        document.getElementById('addr').innerHTML = cfg.address
          ? `<b>${esc(cfg.schoolName)}</b><br>${esc(cfg.address)}<br>${esc(cfg.addressNote)}<br>
             <a class="btn secondary small" style="margin-top:10px" target="_blank" rel="noopener"
                href="https://www.google.com/maps/search/?api=1&query=${q}">在 Google 地圖開啟</a>` : '';
      } catch (e) {
        box.innerHTML = `<div class="alert error">${esc(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
